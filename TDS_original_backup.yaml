esphome:
  name: tds-esp8266
  friendly_name: tds-esp8266
#  platform: ESP8266
#  board: nodemcuv2
  includes:
   - TDSSensor.h

esp8266:
  board: nodemcuv2
# Enable logging
logger:
  # level: VERBOSE #makes uart stream available in esphome logstream
  baud_rate: 0 #disable logging over uart



# Enable Home Assistant API
api:
  password: ""



ota:
  - platform: esphome
    password: !secret ota_password


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Tds-Esp8266 Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

display:
    platform: tm1637
    id: tm1637_display
    clk_pin: D1
    dio_pin: D2
    inverted: true
    length: 4
    intensity: 2
    lambda: |-
      if (id(tds_switch).state == false) {
        it.print("    ");
      } else {
        it.printf("%4.0f", id(tds1).state);
      }


uart:
  - id: uart_bus1
    tx_pin: TX
    rx_pin: RX
    baud_rate: 9600
    # debug:
      # direction: BOTH
      # dummy_receiver: true
      # after:
      #   delimiter: "\n"
      # sequence:
      #   - lambda: UARTDebug::log_string(direction, bytes);

sensor:
  - platform: custom
    lambda: |-
      auto tds_sensor = new TDSSensorComponent(id(uart_bus1));
      App.register_component(tds_sensor);
      return {tds_sensor->tds1,tds_sensor->temperature1,tds_sensor->tds2,tds_sensor->temperature2};
    sensors:
      - name: "tds1"       #纯水TDS
        id: "tds1"
        unit_of_measurement: ppm
        accuracy_decimals: 1
      - name: "temperature1"
        id: "temperature1"
        unit_of_measurement: °C
        accuracy_decimals: 2
      - name: "tds2"
        id: "tds2"
        unit_of_measurement: ppm
        accuracy_decimals: 1
      - name: "temperature2"
        id: "temperature2"
        unit_of_measurement: °C
        accuracy_decimals: 2

#flow meter D6=pin12 input flowmeter; D5=pin14 output flowmeter;

#sensor:
  - platform: pulse_counter
    pin: D6
    name: "Input Water Rate"
    id: water1
    #accuracy_decimals: 1      #小数点位
    unit_of_measurement: 'L/Min'
    update_interval: 5s #上报时间间隔
    filters:
      - lambda: return (x / 1920.0) * 1.0;    #另外一种计算方法
    total:
      unit_of_measurement: 'L'
      name: 'Total Water Usage'
      device_class: water
      state_class: total_increasing
      filters:
        - lambda: return (x / 1920.0) * 1.0;    #另外一种计算方法


  - platform: total_daily_energy
    name: "Today's Water Usage"
    power_id: water1
    unit_of_measurement: 'L'
    state_class: total_increasing
    filters:
      - multiply: 60  #1分钟换算成一秒，升换算成方=1*60


  - platform: pulse_counter
    pin: D5
    name: "Output Water Rate"
    id: water2
    unit_of_measurement: 'L/Min'
    update_interval: 5s #上报时间间隔
    filters:
      - multiply: 0.00052083333333333333  #一升水1920个脉冲1/1920=0.000520833333333333
    total:
      unit_of_measurement: 'L'
      name: 'Total Purified Water Usage'
      device_class: water
      state_class: total_increasing
      filters:
        - multiply: 0.00052083333333333  # (1/1920 pulses per kWh)


  - platform: total_daily_energy
    name: "Today's Purified Water Usage"
    power_id: water2
    unit_of_measurement: 'L'
    state_class: total_increasing
    filters:
      - multiply: 60  #1分钟换算成一秒，升换算成方=1*60




switch:
  - platform: template
    name: "TDS Switch"
    id: "tds_switch"
    restore_mode: ALWAYS_ON
    lambda: return id(tds_switch).state;
    optimistic: true
    # turn_on_action:
      # - uart.write: [0x55, 0x07, 0x05, 0x01, 0x00, 0x00, 0x00, 0x62]
      # - uart.write: [0x55, 0x07, 0x03, 0x01, 0x01, 0x0B, 0xCA, 0x36]
    turn_off_action:
      - uart.write: [0x55, 0x07, 0x06, 0x00, 0x00, 0x00, 0x00, 0x62]
    #   - uart.write: [0x55, 0x07, 0x05, 0x02, 0x00, 0x00, 0x00, 0x63]
      # - switch.turn_on: switch1

time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: /2
        then:
          - if:
              condition:
                lambda: |-
                  if (id(tds_switch).state == true) {
                    auto time = id(sntp_time).now();
                    return time.second != 0;
                  }
                  return false;
              then:
                - uart.write: [0x55, 0x07, 0x05, 0x01, 0x00, 0x00, 0x00, 0x62]

  - platform: sntp
    on_time:
      - seconds: /5
        then:
          - if:
              condition:
                lambda: |-
                  return id(tds_switch).state == true;
              then:
                - uart.write: [0x55, 0x07, 0x05, 0x02, 0x00, 0x00, 0x00, 0x63]

